name: Update Microsoft Articles

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Jamais deux runs en même temps (évite les push concurrents)
concurrency:
  group: update-articles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install feedparser beautifulsoup4 python-dotenv langchain-groq langchain-core

      - name: Run scraper
        run: python scraper.py

      - name: Run agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL_AGENT: ${{ vars.GROQ_MODEL_AGENT }}
        # --limite : nombre max d'articles analysés par run, À AJUSTER selon ta limite Groq (requêtes/jour)
        run: python agent.py --limite 40

      - name: Commit and push new articles
        if: always()
        run: |
          git config --global user.name "MsScope Bot"
          git config --global user.email "mscope@insomea.com"
          git add data/articles.json data/rapport_agent.json data/articles_envoyes.json
          git diff --staged --quiet || git commit -m "Auto-update articles $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push